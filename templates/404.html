<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <title>404 · 页面不存在 / Not found · Termify</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}?v=20261026a">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=20261026a">
</head>
<body>

    <!-- ═══════════ NAVIGATION ═══════════ -->
    <nav>
        <div class="container">
            <a href="/" class="logo">
                <div class="logo-text">Termi<span>fy</span></div>
            </a>
            <ul class="nav-links">
                <li><a href="/">动画工坊</a></li>
                <li><a href="/text-art">字符艺术</a></li>
                {% if gallery_enabled %}<li><a href="/gallery">画廊</a></li>{% endif %}
            </ul>
            <a href="https://github.com/ZhangJing-gugugaga/Termify" class="nav-github" target="_blank">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
                GitHub
            </a>
        </div>
    </nav>

    <!-- ═══════════ 404 ═══════════ -->
    <section class="hero">
        <div class="container">
            <h1>404<span class="highlight">·</span>页面不存在</h1>
            <p class="hero-subtitle">
                你要找的地址不存在，或者内容已经被删除了。<br>
                This address does not exist, or the content has been removed.
            </p>
            <div class="gallery-empty">
                <p>
                    返回 <a href="/">动画工坊 / Animation Lab</a>
                    · <a href="/text-art">字符艺术 / Text Art</a>
                    {% if gallery_enabled %}· <a href="/gallery">画廊 / Gallery</a>{% endif %}
                </p>
            </div>
        </div>
    </section>

</body>
</html>
