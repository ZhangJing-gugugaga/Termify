                <div class="logo-text">Termi<span>fy</span></div>

            <ul class="nav-links">
                <li><a href="/gallery">画廊</a></li>

                GitHub
            </a>
        </div>
    </nav>

    <!-- ═══════════ LOGIN ═══════════ -->
    <section class="admin-login" id="adminLogin">
        <div class="container">
            <div class="admin-login-box">
                <h1>管理后台</h1>
                <p class="admin-login-hint">请输入管理员密码</p>
                <input type="password" class="admin-login-input" id="adminPwd" placeholder="密码" autofocus>
                <p id="adminLoginError" role="alert" style="display:none;color:var(--red,#ff3b30);margin:8px 0 0;">口令错误，请重试 / Wrong password.</p>
                <button class="admin-login-btn" id="adminLoginBtn">登录</button>
            </div>
        </div>
    </section>

    <!-- ═══════════ ADMIN PANEL ═══════════ -->
    <section class="admin-panel" id="adminPanel" style="display:none;">
        <div class="container">
            <button type="button" class="admin-login-btn" id="adminSignOut" style="display:block;margin:0 0 16px auto;">退出 / Sign out</button>
            <div class="admin-tabs">
                <button class="admin-tab active" data-tab="works">作品列表</button>
                <button class="admin-tab" data-tab="reports">举报队列</button>
            </div>

            <!-- Works tab -->
            <div class="admin-tab-content active" id="tab-works">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>标题</th>
                            <th>作者</th>
                            <th>❤</th>
                            <th>👁</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="adminWorksBody"></tbody>
                </table>
                <div class="admin-empty" id="adminWorksEmpty" style="display:none;">暂无作品 / No works yet</div>
            </div>

            <!-- Reports tab -->
            <div class="admin-tab-content" id="tab-reports">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>作品</th>
                            <th>原因</th>
                            <th>描述</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="adminReportsBody"></tbody>
                </table>
                <div class="admin-empty" id="adminReportsEmpty" style="display:none;">暂无举报 / No reports</div>
            </div>
        </div>
    </section>

    <!-- ═══════════ FOOTER ═══════════ -->
    <footer>
        <div class="container">
            <p class="footer-text"><a href="https://github.com/ZhangJing-gugugaga/Termify">Termify</a> — 万物皆可终端 · MIT License</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/admin_page.js') }}?v=20261030a" defer></script>
</body>
</html>
